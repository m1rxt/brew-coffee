<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Управление — Brew Coffee</title><link rel="stylesheet" href="/style.css"></head><body><header class="topbar"><a class="brand" href="/">BREW<span>COFFEE</span></a><nav><a href="/">На сайт ↗</a></nav><span class="admin-link">ADMIN WORKSPACE</span></header><main class="dashboard"><div class="eyebrow">CATALOG MANAGEMENT</div><h1>Управление <i>меню</i></h1><div class="dash-head"><p>Добавляй, редактируй и удаляй позиции каталога.</p><button class="cta" id="add-btn">+ Новый товар</button></div><div id="admin-products" class="admin-table">Загрузка...</div><h2 class="orders-title">Последние <i>заказы</i></h2><div id="orders" class="admin-table">Загрузка...</div></main>
<div class="modal" id="modal"><form id="product-form" class="modal-card"><button type="button" class="x" id="close">×</button><div class="eyebrow">PRODUCT DETAILS</div><h2 id="form-title">Новый товар</h2><label>Название<input name="name" required maxlength="120"></label><label>Описание<textarea name="description"></textarea></label><div class="form-row"><label>Цена, ₸<input name="price" type="number" min="1" step="1" required></label><label>Категория<select name="category_id" id="form-category" required></select></label></div><label>Ссылка на фото<input name="image_url" type="url"></label><label class="availability"><input name="is_available" type="checkbox" checked> Доступен в меню</label><button class="cta" type="submit">Сохранить товар</button><p id="form-message"></p></form></div><script src="/admin.js"></script></body></html>
